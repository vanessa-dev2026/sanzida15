<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ebdd" />
  <title>三打十五</title>
  <link rel="stylesheet" href="web/style.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <h1>三打十五</h1>
      <div class="hud-line">
        <span id="status" class="status">你执狼 · 轮到你</span>
        <span id="counter" class="counter">羊 15/15 · 0 步</span>
      </div>
    </header>

    <div class="board-wrap">
      <div class="board" id="board">
        <svg class="lattice" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g stroke="#1c1a17" stroke-opacity="0.22" stroke-width="0.35">
            <line x1="10" y1="10" x2="90" y2="10" />
            <line x1="10" y1="30" x2="90" y2="30" />
            <line x1="10" y1="50" x2="90" y2="50" />
            <line x1="10" y1="70" x2="90" y2="70" />
            <line x1="10" y1="90" x2="90" y2="90" />
            <line x1="10" y1="10" x2="10" y2="90" />
            <line x1="30" y1="10" x2="30" y2="90" />
            <line x1="50" y1="10" x2="50" y2="90" />
            <line x1="70" y1="10" x2="70" y2="90" />
            <line x1="90" y1="10" x2="90" y2="90" />
          </g>
        </svg>
        <div class="points" id="points"></div>
      </div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <div class="overlay-title" id="overlay-title">狼胜</div>
          <div class="overlay-sub" id="overlay-sub"></div>
          <button class="primary" id="again">再来一局</button>
        </div>
      </div>
    </div>

    <footer class="controls">
      <div class="seg" id="side-seg">
        <button data-side="wolf" class="seg-btn active">执狼</button>
        <button data-side="sheep" class="seg-btn">执羊</button>
      </div>
      <div class="seg" id="level-seg">
        <button data-level="newbie" class="seg-btn">新兵</button>
        <button data-level="officer" class="seg-btn active">校尉</button>
        <button data-level="general" class="seg-btn">将军</button>
      </div>
      <div class="row">
        <button class="ghost" id="restart">重开</button>
        <button class="ghost" id="hint">提示</button>
      </div>
      <div class="row">
        <button class="ghost" id="undo">撤销</button>
        <button class="ghost" id="manual">双人对战</button>
      </div>
      <button class="ghost wide" id="invite">邀请朋友接着下</button>
      <button class="primary wide" id="net-open">联机对战（实时）</button>
    </footer>
    <div class="invite" id="net-panel" hidden>
      <div class="invite-card">
        <div class="invite-title">联机对战</div>
        <div class="invite-hint" id="net-status">创建房间，把房号发给朋友</div>
        <div class="seg" id="net-side" style="margin-bottom:10px">
          <button data-ns="wolf" class="seg-btn active">我执狼</button>
          <button data-ns="sheep" class="seg-btn">我执羊</button>
        </div>
        <button class="primary wide" id="net-create">创建房间</button>
        <div class="row" style="margin-top:10px">
          <input id="net-code" class="code-input" placeholder="输入房号" maxlength="4" />
          <button class="ghost" id="net-join">加入</button>
        </div>
        <button class="ghost wide" id="net-close" style="margin-top:10px">关闭</button>
      </div>
    </div>

    <div class="invite" id="invite-panel" hidden>
      <div class="invite-card">
        <div class="invite-title">把这条链接发给朋友</div>
        <div class="invite-hint">他打开后从当前这步接着下（你走狼、他走羊，或反过来）</div>
        <textarea id="invite-text" readonly rows="4"></textarea>
        <div class="row">
          <button class="ghost" id="invite-close">关闭</button>
          <button class="primary" id="invite-copy">复制链接</button>
        </div>
      </div>
    </div>
  </main>
  <!-- P2P 直连用；加载失败会自动退回服务器模式 -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
  <script type="module" src="dist/web/main.js"></script>
</body>
</html>
